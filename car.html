<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>Hill Rally - Car Level</title><meta name="theme-color" content="#2a4a78">
<style>html,body{margin:0;height:100%;background:#2a4a78;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%}
.p{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));width:min(26vw,150px);height:min(26vw,150px);max-height:36vh;max-width:36vh;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font:800 16px system-ui;background:rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.55);touch-action:none}.p.on{background:rgba(255,210,60,.5)}
#brake{left:18px}#gas{right:18px;background:rgba(40,160,60,.45)}#back{position:fixed;left:10px;top:calc(8px + env(safe-area-inset-top));color:#fff;background:rgba(0,0,0,.45);padding:7px 12px;border-radius:14px;text-decoration:none;font:700 12px system-ui}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#fff;background:rgba(0,0,0,.5);font:800 30px system-ui;text-align:center}#msg small{font:500 15px system-ui}</style></head><body>
<canvas id="c"></canvas><a id="back" href="./">&#9664; GAME</a><div id="brake" class="p">BRAKE<br>/ TILT</div><div id="gas" class="p">GAS</div><div id="msg"></div>
<script>
'use strict';
var cv=document.getElementById('c'),g=cv.getContext('2d'),W,H,DPR;
function fit(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR}addEventListener('resize',fit);fit();
var G=1500,keys={},gas=0,brk=0;
function bind(id,f){var e=document.getElementById(id);e.addEventListener('pointerdown',function(ev){ev.preventDefault();e.setPointerCapture(ev.pointerId);f(1);e.classList.add('on')});var u=function(){f(0);e.classList.remove('on')};e.addEventListener('pointerup',u);e.addEventListener('pointercancel',u)}
bind('gas',function(v){gas=v});bind('brake',function(v){brk=v});
addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=1;if(S.dead&&(e.key==='Enter'||e.key===' '))reset()});addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=0});
document.getElementById('msg').addEventListener('pointerdown',function(){if(S.dead)reset()});
// terrain
function amp(x){return 40+Math.min(110,x/120)}
function ramp(x){var k=x%2600;return (k>1700&&k<1950)?-Math.sin((k-1700)/250*Math.PI)*120*Math.min(1,x/4000+.4):0}
function ter(x){return 520+amp(x)*(Math.sin(x/190)+.55*Math.sin(x/83+1.3)+.3*Math.sin(x/430))+ramp(x)}
function slope(x){return (ter(x+6)-ter(x-6))/12}
var S;function reset(){S={x:200,y:ter(200),vx:0,vy:0,s:0,ang:0,av:0,air:false,fuel:1,coins:0,dist:0,dead:false,best:S?S.best:0,wr:0,items:{},t:0};document.getElementById('msg').style.display='none'}reset();
function item(i){var k=i;if(S.items[k]!==undefined)return S.items[k];var h=Math.sin(i*12.9898)*43758.5453;h-=Math.floor(h);S.items[k]=h<.12?{t:'fuel',x:i*140+60}:(h<.7?{t:'coin',x:i*140+60}:null);return S.items[k]}
function die(why){S.dead=true;S.best=Math.max(S.best,Math.floor(S.dist));var m=document.getElementById('msg');m.innerHTML=why+'<small>Distance '+Math.floor(S.dist)+' m &middot; Coins '+S.coins+' &middot; Best '+S.best+' m<br>Tap / Enter to retry</small>';m.style.display='flex'}
function step(dt){
 if(S.dead)return;S.t+=dt;var up=gas||keys.d||keys.arrowright||keys.w||keys.arrowup,dn=brk||keys.a||keys.arrowleft||keys.s||keys.arrowdown;
 var fuelUse=up?.045:.012;S.fuel=Math.max(0,S.fuel-fuelUse*dt);
 if(!S.air){
  var th=Math.atan(slope(S.x)),A=S.fuel>0&&up?620:0;
  S.s+=(A-(dn?900:0)*Math.sign(S.s||1)*(Math.abs(S.s)>10?1:0)+G*.55*Math.sin(th)-S.s*.35)*dt; if(S.s<-120)S.s=-120;
  S.vx=S.s*Math.cos(th);S.vy=S.s*Math.sin(th);var nx=S.x+S.vx*dt,ny=S.y+S.vy*dt,gy=ter(nx);
  S.ang+=(th-S.ang)*Math.min(1,dt*14);S.x=nx;
  if(ny<gy-3&&S.vy<-50||(ny<gy-9)){S.air=true;S.y=ny;S.av=0}else S.y=gy;
 }else{
  S.vy+=G*dt;S.x+=S.vx*dt;S.y+=S.vy*dt;S.av=(up?2.6:0)-(dn?2.6:0)||S.av*.98;S.ang+=S.av*dt;
  var gy=ter(S.x);if(S.y>=gy){var th=Math.atan(slope(S.x));var d=Math.abs(((S.ang-th+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI);S.y=gy;
   if(d>1.15){die('FLIPPED!');return}S.air=false;S.s=S.vx*Math.cos(th)+S.vy*Math.sin(th)*.4;if(S.s<0)S.s*=.3}
 }
 if(S.x<80)S.x=80;S.dist=Math.max(S.dist,(S.x-200)/12);
 var i0=Math.floor((S.x-40)/140),i1=Math.floor((S.x+40)/140);for(var i=i0;i<=i1;i++){var it=item(i);if(it&&!it.got&&Math.abs(it.x-S.x)<40&&Math.abs(ter(it.x)-60-S.y)<80){it.got=1;if(it.t==='coin')S.coins++;else S.fuel=Math.min(1,S.fuel+.4)}}
 if(S.fuel<=0&&!S.air&&Math.abs(S.s)<6)die('OUT OF FUEL');
}
function draw(){
 g.setTransform(DPR,0,0,DPR,0,0);var sc=Math.min(1,Math.max(.55,H/700)),cx=S.x-W/(2*sc)*.55,cy=S.y-H/(2*sc)*.9+30;
 var gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#2a4a78');gr.addColorStop(.65,'#8fc0e8');gr.addColorStop(1,'#e8dcb0');g.fillStyle=gr;g.fillRect(0,0,W,H);
 g.fillStyle='rgba(255,255,255,.6)';for(var i=0;i<5;i++){var x=((i*420-S.x*.08)%(W+300)+W+300)%(W+300)-150;g.beginPath();g.ellipse(x,60+i*28,60,16,0,0,7);g.ellipse(x+36,66+i*28,40,12,0,0,7);g.fill()}
 g.fillStyle='#5b7fa3';g.beginPath();g.moveTo(0,H);for(var x=0;x<=W+30;x+=30)g.lineTo(x,H*.55-70*Math.abs(Math.sin((x+S.x*.15)*.004))-30*Math.sin((x+S.x*.15)*.012));g.lineTo(W,H);g.fill();
 g.fillStyle='#3d6b4a';g.beginPath();g.moveTo(0,H);for(var x=0;x<=W+30;x+=30)g.lineTo(x,H*.7-50*Math.abs(Math.sin((x+S.x*.3)*.006))-20*Math.sin((x+S.x*.3)*.02));g.lineTo(W,H);g.fill();
 g.save();g.scale(sc,sc);g.translate(-cx,-cy);
 var x0=cx-20,x1=cx+W/sc+20;g.beginPath();g.moveTo(x0,cy+H/sc+50);for(var x=x0;x<=x1;x+=12)g.lineTo(x,ter(x));g.lineTo(x1,cy+H/sc+50);g.closePath();var dg=g.createLinearGradient(0,cy,0,cy+H/sc);dg.addColorStop(0,'#8a6038');dg.addColorStop(1,'#4b3220');g.fillStyle=dg;g.fill();
 g.strokeStyle='#5fb04a';g.lineWidth=12;g.lineJoin='round';g.beginPath();for(var x=x0;x<=x1;x+=12){var y=ter(x);x===x0?g.moveTo(x,y):g.lineTo(x,y)}g.stroke();g.strokeStyle='#8be060';g.lineWidth=4;g.stroke();
 for(var i=Math.floor(x0/140);i<=Math.ceil(x1/140);i++){var it=item(i);if(it&&!it.got){var y=ter(it.x)-60+Math.sin(S.t*4+i)*4;if(it.t==='coin'){g.fillStyle='#ffd24a';g.strokeStyle='#b8860b';g.lineWidth=3;g.beginPath();g.arc(it.x,y,13,0,7);g.fill();g.stroke()}else{g.fillStyle='#d83a2a';g.fillRect(it.x-12,y-15,24,30);g.fillStyle='#fff';g.font='bold 14px system-ui';g.textAlign='center';g.fillText('F',it.x,y+5)}}}
 car();g.restore();
 g.fillStyle='rgba(0,0,0,.45)';g.fillRect(120,8,150,12);g.fillStyle=S.fuel>.25?'#ffb030':'#f04030';g.fillRect(120,8,150*S.fuel,12);g.fillStyle='#fff';g.font='700 12px system-ui';g.textAlign='left';g.fillText('FUEL',120,34);
 g.textAlign='right';g.fillText(Math.floor(S.dist)+' m   ● '+S.coins,W-12,24);
}
function car(){
 g.save();g.translate(S.x,S.y);g.rotate(S.ang);
 g.fillStyle='rgba(0,0,0,.2)';g.beginPath();g.ellipse(0,2,48,6,0,0,7);g.fill();
 var wr=S.s/18*S.t;function wheel(x){g.save();g.translate(x,-14);g.fillStyle='#111';g.beginPath();g.arc(0,0,15,0,7);g.fill();g.rotate(S.x/15);g.fillStyle='#bbb';g.beginPath();g.arc(0,0,8,0,7);g.fill();g.fillStyle='#555';g.fillRect(-1,-8,2,16);g.fillRect(-8,-1,16,2);g.restore()}
 g.fillStyle='#e03a2a';g.beginPath();g.moveTo(-46,-16);g.lineTo(-46,-34);g.quadraticCurveTo(-40,-40,-26,-40);g.lineTo(-14,-58);g.lineTo(18,-58);g.lineTo(32,-40);g.lineTo(44,-36);g.quadraticCurveTo(50,-34,50,-22);g.lineTo(50,-16);g.closePath();g.fill();
 g.fillStyle='#9ad4f0';g.beginPath();g.moveTo(-10,-54);g.lineTo(-20,-40);g.lineTo(28,-40);g.lineTo(16,-54);g.closePath();g.fill();
 g.fillStyle='#e2b799';g.beginPath();g.arc(2,-47,6,0,7);g.fill();g.fillStyle='#2d2d2d';g.fillRect(-4,-54,12,4);
 g.fillStyle='#ffe680';g.fillRect(44,-30,6,6);g.fillStyle='#c02a1c';g.fillRect(-46,-30,5,6);
 wheel(-28);wheel(30);
 if((keys.d||keys.arrowright||keys.w||gas)&&S.fuel>0){g.fillStyle='rgba(200,200,200,.5)';g.beginPath();g.arc(-52,-12,5+Math.random()*4,0,7);g.fill()}
 g.restore();
}
var last=performance.now();(function loop(n){var dt=Math.min(.033,(n-last)/1000);last=n;step(dt);draw();requestAnimationFrame(loop)})(last);
window.__car={get S(){return S},keys:keys,setGas:function(v){gas=v}};
</script><script src="land.js"></script><script src="talk.js" data-game="car"></script></body></html>
