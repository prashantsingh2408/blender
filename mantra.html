<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>Mantra Wars</title><meta name="theme-color" content="#0f172a"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@600;800&display=swap">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;--dock-bottom:24px;background:#0b0820;color:#f8fafc;font-family:"Noto Sans Devanagari",system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:max(8px,env(safe-area-inset-top)) 14px 6px;font-weight:800;font-size:15px;pointer-events:none;text-shadow:0 1px 3px #000}
#top b{color:#f59e0b}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(11,8,32,.92);z-index:6;text-align:center;padding:24px}
#start h1{margin:0;font-size:clamp(30px,8vw,56px);line-height:1;background:linear-gradient(90deg,#f59e0b,#fb7185,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
#start p{margin:0;color:#c4b5fd;font-size:15px;max-width:420px;line-height:1.4}
#start .sp{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:460px}
#start .sp span{background:#1e1b4b;border:1px solid #4c1d95;border-radius:99px;padding:6px 12px;font-size:14px}
#start button,#msg button{border:0;border-radius:14px;background:#f59e0b;color:#0b0820;font:800 18px inherit;padding:12px 28px;cursor:pointer}
#start.off,#msg:not(.on){display:none}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(11,8,32,.9);z-index:6;text-align:center;padding:24px}
#msg h2{margin:0;font-size:34px}#msg p{margin:0;color:#c4b5fd}
#heard{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(15,23,42,.85);border-radius:12px;padding:6px 14px;font-weight:800;font-size:16px;color:#fde68a;display:none;max-width:92vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#heard.on{display:block}
</style></head><body>
<canvas id="c"></canvas>
<div id="top"><span>❤️ <b id="hp">3</b></span><span>✨ <b id="mana">5</b></span><span>लहर <b id="wave">1</b> · <b id="score">0</b></span></div>
<div id="heard"></div>
<div id="start">
<h1>मंत्र युद्ध</h1>
<p>असुर आ रहे हैं। हर असुर पर एक <b>मंत्र</b> लिखा है — वही मंत्र <b>ज़ोर से बोलो</b>, असुर भस्म। बटन नहीं, सिर्फ़ आवाज़।</p>
<div class="sp"><span>🔥 अग्नि</span><span>💧 जल</span><span>🌪️ वायु</span><span>⚡ वज्र</span><span>🌿 पृथ्वी</span><span>🛡️ ढाल = बचाव</span><span>❄️ शांति = सब रुकें</span><span>💚 जीवन = जान वापस</span></div>
<p style="font-size:13px;color:#8b7bb5">माइक न चले तो असुर पर टैप करो</p>
<button id="go">🎤 शुरू करो</button>
</div>
<div id="msg"><h2 id="mt"></h2><p id="mp"></p><button id="again">🎤 फिर से</button></div>
<script>
(function(){
var cv=document.getElementById('c'),g=cv.getContext('2d'),W=0,H=0,DPR=1;
function fit(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',fit);fit();
var SPELLS=[{id:'agni',w:'अग्नि',em:'🔥',c:'#fb923c',re:/अग्नि|आग|agni|fire|अगनी|अग्नी/},{id:'jal',w:'जल',em:'💧',c:'#38bdf8',re:/\bजल\b|जल|पानी|jal|water|जाल/},{id:'vayu',w:'वायु',em:'🌪️',c:'#a7f3d0',re:/वायु|हवा|vayu|wind|air|वायू/},{id:'vajra',w:'वज्र',em:'⚡',c:'#fde047',re:/वज्र|बिजली|vajra|thunder|lightning|वज्रा|बज्र/},{id:'prithvi',w:'पृथ्वी',em:'🌿',c:'#86efac',re:/पृथ्वी|धरती|prithvi|earth|प्रथ्वी|पृथ्वि/}];
var ENEMY=['👹','👺','🧟','🐉','💀'];
var S,stars=[],run=false,hs=0;try{hs=+localStorage.getItem('mantra_hs')||0}catch(e){}
for(var i=0;i<90;i++)stars.push([Math.random(),Math.random(),Math.random()*1.6+.4]);
function reset(){S={hp:3,mana:5,wave:1,score:0,t:0,en:[],fx:[],spawnT:1.2,shield:0,freeze:0,kills:0,combo:0,comboT:0,flash:0,shake:0,best:hs};hud()}
function wiz(){return{x:W/2,y:H-Math.max(90,H*0.16)}}
function spawnEnemy(){var big=S.wave>=3&&Math.random()<0.25,n=big?2:1,ms=[];for(var i=0;i<n;i++){var sp=SPELLS[Math.floor(Math.random()*SPELLS.length)];if(ms.indexOf(sp)<0)ms.push(sp);else i--}
 var side=Math.random();var x=side<0.5?W*(0.1+Math.random()*0.8):(Math.random()<0.5?-20:W+20),y=side<0.5?-30:H*(0.1+Math.random()*0.4);
 var w=wiz(),d=Math.hypot(w.x-x,w.y-y),dur=Math.max(5.5,11-S.wave*0.6)*(big?1.35:1);
 S.en.push({x:x,y:y,sx:x,sy:y,vx:(w.x-x)/dur,vy:(w.y-y)/dur,m:ms,em:big?'🐉':ENEMY[Math.floor(Math.random()*4)],big:big,hp:n,r:big?30:22,bob:Math.random()*9,hit:0})}
function burst(x,y,c,n){for(var i=0;i<(n||14);i++){var a=Math.random()*6.283,s=40+Math.random()*160;S.fx.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0.5+Math.random()*0.4,c:c,r:2+Math.random()*3})}}
function bolt(from,to,c){S.fx.push({bolt:1,x:from.x,y:from.y,tx:to.x,ty:to.y,t:0.22,c:c})}
function cast(sp){if(!run)return false;var w=wiz(),target=null,bd=1e9;S.en.forEach(function(e){if(e.m[0]===sp){var d=Math.hypot(e.x-w.x,e.y-w.y);if(d<bd){bd=d;target=e}}});
 if(!target){S.fx.push({ring:1,x:w.x,y:w.y,t:0.35,c:sp.c});return false}
 bolt(w,target,sp.c);target.m.shift();target.hit=0.2;if(!target.m.length){kill(target)}else{say(target.m[0].w+' बचा है!')}return true}
function kill(e){S.en.splice(S.en.indexOf(e),1);burst(e.x,e.y,'#fde68a',e.big?30:16);S.kills++;S.combo++;S.comboT=2.5;var pts=(e.big?30:10)*Math.min(5,S.combo);S.score+=pts;S.mana=Math.min(10,S.mana+(e.big?2:1));S.shake=0.15;if(S.kills%8===0){S.wave++;say('लहर '+S.wave+'!')}hud()}
function special(k){if(k==='shield'){if(S.mana<2){say('मन कम है');return true}S.mana-=2;S.shield=1;S.fx.push({ring:1,x:wiz().x,y:wiz().y,t:0.6,c:'#60a5fa'});say('ढाल तैयार');hud();return true}
 if(k==='freeze'){if(S.mana<3){say('मन कम है');return true}S.mana-=3;S.freeze=2.5;S.flash=0.3;say('सब रुक गए');hud();return true}
 if(k==='heal'){if(S.mana<4){say('मन कम है');return true}if(S.hp>=3){say('जान पूरी है');return true}S.mana-=4;S.hp++;burst(wiz().x,wiz().y,'#4ade80',20);say('जान वापस');hud();return true}return false}
function voice(text){var l=String(text).toLowerCase();if(!run){if(/शुरू|फिर|start|again|चलो/.test(l)){start();return true}return false}
 var did=false;if(/ढाल|shield|रक्षा|कवच/.test(l))did=special('shield')||did;if(/शांति|रुको|freeze|stop|ठहर/.test(l))did=special('freeze')||did;if(/जीवन|heal|जान|ठीक करो/.test(l))did=special('heal')||did;
 SPELLS.forEach(function(sp){if(sp.re.test(l)){did=cast(sp)||did}});
 if(did){showHeard(text)}return did}
window.GameVoice=voice;
function say(t){if(window.Talk)Talk.say(t)}
var heardT=null;function showHeard(t){var h=document.getElementById('heard');h.textContent='🎤 '+t;h.classList.add('on');clearTimeout(heardT);heardT=setTimeout(function(){h.classList.remove('on')},1200)}
function step(dt){if(!run)return;S.t+=dt;S.spawnT-=dt;if(S.spawnT<=0){spawnEnemy();S.spawnT=Math.max(1.1,3.4-S.wave*0.3)}
 if(S.freeze>0)S.freeze-=dt;if(S.shake>0)S.shake-=dt;if(S.flash>0)S.flash-=dt;if(S.comboT>0){S.comboT-=dt;if(S.comboT<=0)S.combo=0}
 S.mana=Math.min(10,S.mana+dt*0.35);var w=wiz();
 S.en.forEach(function(e){if(S.freeze<=0){e.x+=e.vx*dt;e.y+=e.vy*dt}e.hit-=dt;if(Math.hypot(e.x-w.x,e.y-w.y)<e.r+18){S.en.splice(S.en.indexOf(e),1);if(S.shield>0){S.shield=0;burst(w.x,w.y,'#60a5fa',24);say('ढाल ने बचाया')}else{S.hp--;S.shake=0.35;S.flash=0.25;burst(w.x,w.y,'#f87171',24);say(S.hp>0?'लगी! '+S.hp+' जान बची':'');if(S.hp<=0)end()}hud()}});
 S.fx.forEach(function(f){f.t-=dt;if(!f.bolt&&!f.ring){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=120*dt}});S.fx=S.fx.filter(function(f){return f.t>0});hud()}
function end(){run=false;if(S.score>hs){hs=S.score;try{localStorage.setItem('mantra_hs',hs)}catch(e){}}document.getElementById('mt').textContent='💀 असुर जीत गए';document.getElementById('mp').textContent='स्कोर '+S.score+' · लहर '+S.wave+' · बेस्ट '+hs+' — "फिर से" बोलो';document.getElementById('msg').classList.add('on');if(window.Talk)Talk.event('lose')}
function start(){reset();run=true;document.getElementById('start').classList.add('off');document.getElementById('msg').classList.remove('on');if(window.Agent&&!Agent.listening)Agent.listen(true);say('मंत्र बोलो!')}
function hud(){document.getElementById('hp').textContent=S.hp;document.getElementById('mana').textContent=Math.floor(S.mana);document.getElementById('wave').textContent=S.wave;document.getElementById('score').textContent=S.score}
function draw(){g.save();if(S.shake>0)g.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
 var grd=g.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#0b0820');grd.addColorStop(1,'#2e1065');g.fillStyle=grd;g.fillRect(-10,-10,W+20,H+20);
 g.fillStyle='#fff';stars.forEach(function(s){g.globalAlpha=0.4+0.6*Math.abs(Math.sin(S.t*0.7+s[0]*9));g.fillRect(s[0]*W,s[1]*H*0.8,s[2],s[2])});g.globalAlpha=1;
 var w=wiz();g.fillStyle='#1e1b4b';g.fillRect(-10,w.y+30,W+20,H);g.fillStyle='#312e81';g.beginPath();g.ellipse(w.x,w.y+34,140,16,0,0,6.283);g.fill();
 if(S.freeze>0){g.fillStyle='rgba(165,243,252,.12)';g.fillRect(-10,-10,W+20,H+20)}
 g.textAlign='center';g.textBaseline='middle';
 S.en.forEach(function(e){var by=Math.sin(S.t*6+e.bob)*3;g.font=(e.r*2)+'px system-ui';if(e.hit>0){g.globalAlpha=0.5}g.fillText(e.em,e.x,e.y+by);g.globalAlpha=1;
  var tw=0;g.font='800 '+(e.big?17:16)+'px "Noto Sans Devanagari",system-ui';e.m.forEach(function(m){tw+=g.measureText(m.w).width+26});var x=e.x-tw/2;
  e.m.forEach(function(m,i){var ww=g.measureText(m.w).width+26;g.fillStyle=i===0?'rgba(15,23,42,.95)':'rgba(15,23,42,.6)';rr(x,e.y-e.r-30,ww,24,8);g.fill();g.strokeStyle=i===0?m.c:'rgba(255,255,255,.2)';g.lineWidth=2;rr(x,e.y-e.r-30,ww,24,8);g.stroke();g.fillStyle=i===0?'#fff':'#94a3b8';g.fillText(m.em+' '+m.w,x+ww/2,e.y-e.r-18);x+=ww+4})});
 g.font='52px system-ui';g.fillText('🧙',w.x,w.y);if(S.shield>0){g.strokeStyle='#60a5fa';g.lineWidth=3;g.globalAlpha=0.6+0.3*Math.sin(S.t*8);g.beginPath();g.arc(w.x,w.y,40,0,6.283);g.stroke();g.globalAlpha=1}
 S.fx.forEach(function(f){if(f.bolt){g.strokeStyle=f.c;g.lineWidth=5;g.globalAlpha=f.t/0.22;g.beginPath();g.moveTo(f.x,f.y-20);var n=6;for(var i=1;i<=n;i++){var t=i/n;g.lineTo(f.x+(f.tx-f.x)*t+(i<n?(Math.random()-.5)*18:0),f.y-20+(f.ty-f.y+20)*t+(i<n?(Math.random()-.5)*18:0))}g.stroke();g.globalAlpha=1}
  else if(f.ring){g.strokeStyle=f.c;g.lineWidth=3;g.globalAlpha=f.t/0.6;g.beginPath();g.arc(f.x,f.y,30+(0.6-f.t)*120,0,6.283);g.stroke();g.globalAlpha=1}
  else{g.fillStyle=f.c;g.globalAlpha=Math.min(1,f.t);g.beginPath();g.arc(f.x,f.y,f.r,0,6.283);g.fill();g.globalAlpha=1}});
 if(S.combo>1&&S.comboT>0){g.fillStyle='#fde68a';g.font='800 22px "Noto Sans Devanagari",system-ui';g.fillText('कॉम्बो ×'+Math.min(5,S.combo),W/2,H*0.42)}
 if(S.flash>0){g.fillStyle='rgba(255,255,255,'+(S.flash*0.6)+')';g.fillRect(-10,-10,W+20,H+20)}
 g.restore()}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
cv.addEventListener('pointerdown',function(ev){if(!run)return;var x=ev.clientX,y=ev.clientY,best=null,bd=48;S.en.forEach(function(e){var d=Math.hypot(e.x-x,e.y-y);if(d<bd){bd=d;best=e}});if(best){cast(best.m[0]);showHeard(best.m[0].w+' (टैप)')}});
document.getElementById('go').onclick=start;document.getElementById('again').onclick=start;
reset();var last=performance.now();(function loop(n){var dt=Math.min(0.05,(n-last)/1000);last=n;step(dt);draw();requestAnimationFrame(loop)})(last);
window.__mantra={get S(){return S},get run(){return run},cast:cast,voice:voice,start:start,SPELLS:SPELLS};
})();
</script>
<script src="talk.js" data-game="mantra"></script><script src="agent.js" data-game="mantra"></script>
</body></html>
