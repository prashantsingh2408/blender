<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Jetpack Arena - Multiplayer</title><meta name="theme-color" content="#1b2a3a">

canvas{position:fixed;inset:0;width:100%;height:100%}

<canvas id="c"></canvas>

<div id="menu"><div id="card">

<script>

// ================= INPUT =================

const touchUI = { L: null, R: null };

// ================= RENDER =================

addEventListener('resize', fit); fit();
